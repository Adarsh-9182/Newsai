# The site publishes itself.
#
# GitHub Actions is the scheduler because it is free and already next to the
# data: the run fetches, summarises, writes data/YYYY-MM-DD.json and commits
# it. Vercel is watching the branch, so the commit is the deploy. Nothing
# else needs to be running anywhere.
#
# Secrets, all under Settings → Secrets and variables → Actions:
#   GEMINI_API_KEY      summaries and the long read (Google AI Studio free tier)
#   DATABASE_URL        the subscriber list (Neon or Supabase)
#   NEWSAI_MAIL_SECRET  signs confirm/unsubscribe links — must match the site's
#   RESEND_API_KEY      sending. Without it the send step prints and mails nobody.

name: daily digest

on:
  schedule:
    # 01:30 UTC = 07:00 IST. Published before the working day starts in India.
    - cron: "30 1 * * *"
  # So a broken morning can be re-run by hand without waiting for tomorrow.
  workflow_dispatch:

# The job writes to the repository, so it needs more than the read-only default.
permissions:
  contents: write

concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `secrets` context cannot be read from a step's `if:`, so the one
    # question the send step asks — is mail configured at all? — is answered
    # here, where secrets are in scope.
    env:
      MAIL_CONFIGURED: ${{ secrets.RESEND_API_KEY != '' && secrets.DATABASE_URL != '' && secrets.NEWSAI_MAIL_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Require the Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci

      - name: Build the digest
        id: build_digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSAI_MAX_STORIES: "25"
        run: npm run daily

      - name: Commit today's digest
        run: |
          git config user.name  "newsai bot"
          git config user.email "noreply@newsai.co.in"
          git add data/
          # A quiet day writes an identical file; committing nothing is success,
          # not failure, so the workflow must not exit non-zero here.
          if git diff --staged --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report digest failure
        if: ${{ failure() }}
        run: |
          echo "## NewsAI digest failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No successful publication was completed by this run. Review the failed step and rerun after fixing its cause." >> "$GITHUB_STEP_SUMMARY"

  mail:
    needs: digest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MAIL_CONFIGURED: ${{ secrets.RESEND_API_KEY != '' && secrets.DATABASE_URL != '' && secrets.NEWSAI_MAIL_SECRET != '' }}
    steps:
      # Read the branch after the digest job so it includes the new edition.
      - uses: actions/checkout@v4
        if: ${{ env.MAIL_CONFIGURED == 'true' }}
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        if: ${{ env.MAIL_CONFIGURED == 'true' }}
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: ${{ env.MAIL_CONFIGURED == 'true' }}
      - name: Send digest and retry pending confirmations
        if: ${{ env.MAIL_CONFIGURED == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSAI_MAIL_SECRET: ${{ secrets.NEWSAI_MAIL_SECRET }}
          NEWSAI_SITE_URL: https://newsai.co.in
        run: npm run send
      - name: Report mail configuration
        if: ${{ env.MAIL_CONFIGURED != 'true' }}
        run: echo "Mail delivery is disabled because its service credentials are incomplete." >> "$GITHUB_STEP_SUMMARY"
